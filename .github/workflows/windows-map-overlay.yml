name: Сборка карты-оверлея Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop-web/**', 'dist/**', '.github/workflows/windows-map-overlay.yml']
  pull_request:
    paths: ['desktop-web/**', 'dist/**', '.github/workflows/windows-map-overlay.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить зависимости
        working-directory: desktop-web
        run: npm install --no-audit --no-fund
      - name: Подготовить Electron
        working-directory: desktop-web
        run: npx install-electron --no
      - name: Проверить структуру базы
        working-directory: desktop-web
        run: npm test
      - name: Подготовить локальную копию сайта
        shell: pwsh
        run: Copy-Item -Recurse dist desktop-web/web
      - name: Проверить окно и карту
        working-directory: desktop-web
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path node_modules/electron/dist/electron.exe) -ArgumentList '"." --self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { if (Test-Path "$env:TEMP/arbatsky-selftest-error.txt") { Get-Content "$env:TEMP/arbatsky-selftest-error.txt" }; throw "Проверка приложения не пройдена: $($p.ExitCode)" }
      - name: Собрать установщик
        working-directory: desktop-web
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Добавить инструкцию
        shell: pwsh
        run: Copy-Item desktop-web/README.md desktop-web/release/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Arbatsky-Map-Overlay-Windows
          path: |
            desktop-web/release/*.exe
            desktop-web/release/README.md
          if-no-files-found: error
          retention-days: 90
      - name: Опубликовать установщик в Releases
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: map-v${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $setup = Get-ChildItem desktop-web/release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Установщик не найден' }
          Copy-Item $setup.FullName desktop-web/release/Arbatsky-Overlay-Setup.exe
          @'
          Приложение с картой статей для Windows x64.

          Карта открывается поверх окон, поддерживает заметки, перемещение статей и категорий. Горячие клавиши: Ctrl+Shift+Space — открыть или скрыть; Ctrl+Shift+F2 — включить или выключить нажатия сквозь окно.

          Совместимость с игрой и её защитой требуется проверить на вашем компьютере. В эксклюзивном полноэкранном режиме игра может скрывать оверлей. Приложение не подписано цифровым сертификатом.
          '@ | Set-Content -Encoding utf8 desktop-web/release/RELEASE_NOTES.md
          gh release create $env:RELEASE_TAG desktop-web/release/Arbatsky-Overlay-Setup.exe --target $env:SOURCE_SHA --title "Карта-оверлей для Windows · $env:RELEASE_TAG" --notes-file desktop-web/release/RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Не удалось создать релиз' }
